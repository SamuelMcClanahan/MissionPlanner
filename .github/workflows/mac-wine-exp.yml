name: macOS Wine experiment (temporary)
# Temporary: reproduce the stop after "TTS: init" that the smoke test of run
# 38965430257 showed. Each job repeats that smoke test exactly (quarantined app,
# first start through the main executable with DEVELOPER_DIR=/var/empty, then a
# second start) and records diagnostics when Mission Planner does not load.
# Remove this file when the cause is known.

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/mac-wine-exp.yml']

permissions:
  contents: read
  actions: read

jobs:
  repro:
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4]
    steps:
      - name: Get the app from run 38965430257
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38965430257 -n MissionPlanner-macOS-wine -D dist -R "$GITHUB_REPOSITORY"
          ditto -x -k dist/MissionPlanner-macOS-wine.zip /Applications
          xattr -r -w com.apple.quarantine "0081;00000000;Safari;" "/Applications/Mission Planner.app"
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Starts
        run: |
          mkdir -p out
          APP="/Applications/Mission Planner.app"
          export WINEPREFIX="$HOME/Library/MissionPlannerWine/prefix"
          W="$APP/Contents/Resources/wine/bin/wine"
          MPLOG="$WINEPREFIX/drive_c/ProgramData/Mission Planner/MissionPlanner.log"
          LLOG="$HOME/Library/Logs/MissionPlannerWine/launcher.log"
          # True when "appload time" was logged at or after time $1 (log rollover safe).
          loaded_since() { cat "$MPLOG.2" "$MPLOG.1" "$MPLOG" 2>/dev/null | grep "appload time" | cut -c1-19 | awk -v t="$1" '$0 >= t { f = 1 } END { exit !f }'; }
          tmo() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          stop_all() {
            pkill -f 'Resources/launcher.sh' || true
            pkill -f 'Contents/MacOS/MissionPlanner' || true
            pkill -f MissionPlanner.exe || true
            "$APP/Contents/Resources/wine/bin/wineserver" -k || true
            sleep 5
          }
          diag() {
            n=$1
            ps -axo pid,ppid,pgid,stat,etime,time,command | grep -E -i 'wine|mission|launcher|\.exe|caffeinate|osascript' | grep -v grep | cut -c1-220 > "out/$n-ps.txt" || true
            screencapture -x "out/$n.png" || true
            upid=$(pgrep -f 'MissionPlanner.exe' | head -1)
            if [ -n "$upid" ]; then
              tmo 60 sample "$upid" 5 -file "out/$n-sample.txt" >/dev/null 2>&1 || true
              ps -M -p "$upid" > "out/$n-threads.txt" 2>&1 || true
            fi
            WINEDEBUG=-all WINEDLLOVERRIDES="winedbg.exe=b" tmo 60 "$W" winedbg --command "info process" > "out/$n-procs.txt" 2>&1 || true
            pid=$(grep -i 'MissionPlanner.exe' "out/$n-procs.txt" | grep -o -E '[0-9a-fA-F]{8}' | head -1)
            printf 'info threads\ninfo share\nbt all\ndetach\n' > "$WINEPREFIX/drive_c/bt.txt"
            if [ -n "$pid" ]; then
              WINEDEBUG=-all WINEDLLOVERRIDES="winedbg.exe=b" tmo 180 "$W" winedbg --file 'C:\bt.txt' "0x$pid" > "out/$n-bt.txt" 2>&1 || true
            fi
            log show --last 15m --style compact --predicate 'process == "tccd" OR process == "syspolicyd" OR subsystem == "com.apple.TCC" OR process == "XProtect"' 2>/dev/null | tail -300 > "out/$n-syslog.txt" || true
            tail -40 "$MPLOG" | cut -c1-250 > "out/$n-mplog.txt" || true
            # A second sample a minute later shows whether the stop changes.
            sleep 60
            WINEDEBUG=-all WINEDLLOVERRIDES="winedbg.exe=b" tmo 180 "$W" winedbg --file 'C:\bt.txt' "0x$pid" > "out/$n-bt2.txt" 2>&1 || true
            ps -axo pid,stat,etime,time,command | grep -i 'MissionPlanner.exe' | grep -v grep > "out/$n-ps2.txt" || true
          }
          now() { date '+%Y-%m-%d %H:%M:%S'; }
          # Wait until setup is done and the exe runs, then up to $2 s for the main window.
          wait_load() {
            n=$1; limit=$2; t0=$3
            started=""
            for i in $(seq 1 360); do
              sleep 5
              if loaded_since "$t0"; then echo "RESULT $n PASS $(( $(date +%s) - $(date -j -f '%Y-%m-%d %H:%M:%S' "$t0" +%s) )) s" | tee -a out/results.txt; return 0; fi
              if [ -z "$started" ] && grep "starting MissionPlanner.exe" "$LLOG" 2>/dev/null | cut -c1-19 | awk -v t="$t0" '$0 >= t { f = 1 } END { exit !f }'; then
                started=$(date +%s)
              fi
              if [ -n "$started" ] && [ $(( $(date +%s) - started )) -gt "$limit" ]; then break; fi
            done
            echo "RESULT $n FAIL" | tee -a out/results.txt
            diag "$n"
          }

          # 1: first start exactly as in the smoke test.
          T=$(now)
          ( export MPWINE_NONINTERACTIVE=1 DEVELOPER_DIR=/var/empty; "$APP/Contents/MacOS/MissionPlanner" ) &
          wait_load first 240 "$T"
          sleep 30
          # 2: second start as in the smoke test.
          stop_all; T=$(now)
          ( export MPWINE_NONINTERACTIVE=1; "$APP/Contents/MacOS/MissionPlanner" ) &
          wait_load second 180 "$T"
          # 3: start through LaunchServices (Finder or Dock).
          stop_all; T=$(now)
          open "$APP"
          wait_load open 180 "$T"
          # 4: once more through the main executable.
          stop_all; T=$(now)
          "$APP/Contents/MacOS/MissionPlanner" &
          wait_load fourth 180 "$T"
          stop_all
          cat out/results.txt

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R ~/Library/Logs/MissionPlannerWine out/ 2>/dev/null || true
          cp "$HOME/Library/MissionPlannerWine/prefix/drive_c/ProgramData/Mission Planner/"MissionPlanner.log* out/ 2>/dev/null || true
          cat out/results.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-${{ matrix.replica }}
          path: out
