name: macOS Wine experiment (temporary)
# Temporary: verify MacWine/patch-wineserver.py on runners where the original
# wineserver crashes (get_device() hash with a negative dev_t). Uses the app
# that run 38981446483 built (original wineserver), records the device numbers
# of all file systems and which file Mission Planner opens at the crash, then
# patches the installed wineserver with the shipping script and starts again.
# Remove this file when done.

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/mac-wine-exp.yml']

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: MacWine

      - name: Get the app from run 38981446483
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38981446483 -n MissionPlanner-macOS-wine -D dist -R "$GITHUB_REPOSITORY"
          ditto -x -k dist/MissionPlanner-macOS-wine.zip /Applications
          xattr -r -w com.apple.quarantine "0081;00000000;Safari;" "/Applications/Mission Planner.app"
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: File system device numbers
        run: |
          mkdir -p out
          # st_dev as a signed 32-bit number, as wineserver sees it on macOS.
          devs() {
            for p in "$@"; do
              d=$(stat -f '%d' "$p" 2>/dev/null) || continue
              s=$d; [ "$d" -ge 2147483648 ] && s=$(( d - 4294967296 ))
              printf '%12s %s%s\n' "$s" "$p" "$([ "$s" -lt 0 ] && echo '   <-- negative')"
            done
          }
          {
            mount
            echo
            mount | sed -E 's/^.* on (.*) \([^)]*\)$/\1/' | while read -r m; do devs "$m"; done
            echo
            devs / /dev /dev/null /private/tmp "$TMPDIR" "$HOME" "$HOME/Documents" "$HOME/Desktop" "$HOME/Downloads" \
                 "$HOME/Library" /Applications /Users /System/Volumes/Data /private/var/folders
          } > out/devices.txt 2>&1
          cat out/devices.txt
          if grep -q negative out/devices.txt; then echo "BAD RUNNER (negative device number)"; fi

      - name: Starts
        run: |
          APP="/Applications/Mission Planner.app"
          export WINEPREFIX="$HOME/Library/MissionPlannerWine/prefix"
          WS="$APP/Contents/Resources/wine/bin/wineserver"
          MPLOG="$WINEPREFIX/drive_c/ProgramData/Mission Planner/MissionPlanner.log"
          LLOG="$HOME/Library/Logs/MissionPlannerWine/launcher.log"
          WLOG="$HOME/Library/Logs/MissionPlannerWine/wine.log"
          now() { date '+%Y-%m-%d %H:%M:%S'; }
          since() { cat "$3.2" "$3.1" "$3" 2>/dev/null | grep -F "$2" | cut -c1-19 | awk -v t="$1" '$0 >= t { f = 1 } END { exit !f }'; }
          crashes() { ls ~/Library/Logs/DiagnosticReports/wineserver-*.ips 2>/dev/null | wc -l | tr -d ' '; }
          stop_all() {
            pkill -f 'Resources/launcher.sh' || true
            pkill -f 'Contents/MacOS/MissionPlanner' || true
            pkill -f 'Mission Planner/MissionPlanner.exe' || true
            "$WS" -k || true
            sleep 3
            pkill -9 -f '^C:\\windows\\' || true
            pkill -9 -f 'Mission Planner/MissionPlanner.exe' || true
            pkill -9 -f 'bin/wineserver' || true
            sleep 2
          }
          trial() {
            n=$1; limit=$2; shift 2
            c0=$(crashes); T=$(now); started=""
            "$@" &
            for i in $(seq 1 400); do
              sleep 5
              if since "$T" "appload time" "$MPLOG"; then echo "RESULT $n PASS (wineserver crashes: $(( $(crashes) - c0 )))" | tee -a out/results.txt; return 0; fi
              if [ -z "$started" ] && since "$T" "starting MissionPlanner.exe" "$LLOG"; then started=$(date +%s); fi
              if [ -n "$started" ] && [ $(( $(date +%s) - started )) -gt "$limit" ]; then break; fi
            done
            echo "RESULT $n FAIL (wineserver crashes: $(( $(crashes) - c0 )))" | tee -a out/results.txt
            return 1
          }
          first() { MPWINE_NONINTERACTIVE=1 DEVELOPER_DIR=/var/empty WINEDEBUG='-all,MissionPlanner.exe:+tid,MissionPlanner.exe:+timestamp,MissionPlanner.exe:+file' "$APP/Contents/MacOS/MissionPlanner"; }
          warm() { MPWINE_NONINTERACTIVE=1 "$APP/Contents/MacOS/MissionPlanner"; }

          # 1: original wineserver, with a file trace for Mission Planner.
          trial original 180 first || true
          cp "$WLOG" out/original-wine.log 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/wineserver-*.ips out/ 2>/dev/null || true
          stop_all

          # 2: the shipping patch.
          python3 MacWine/patch-wineserver.py "$WS"
          codesign --force --sign - "$WS"
          codesign --verify "$WS"
          trial patched-1 180 warm || true
          stop_all
          trial patched-2 180 warm || true
          stop_all
          trial patched-open 180 open "$APP" || true
          sleep 20
          ps -axo pid,stat,etime,time,command | grep -E 'wineserver|MissionPlanner.exe' | grep -v grep || true
          stop_all
          cat out/results.txt

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R ~/Library/Logs/MissionPlannerWine out/ 2>/dev/null || true
          cp "$HOME/Library/MissionPlannerWine/prefix/drive_c/ProgramData/Mission Planner/"MissionPlanner.log* out/ 2>/dev/null || true
          cat out/results.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-${{ matrix.replica }}
          path: out
