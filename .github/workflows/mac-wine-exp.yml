name: macOS Wine .NET experiments
# Runs the first start of a built Mission Planner.app on macOS with process
# lists every 30 s, to find slow setup steps. Variant X1 uses the launcher from
# MacWine/exp/launcher-x1.sh instead of the app's own launcher.

on:
  push:
    paths:
      - '.github/workflows/mac-wine-exp.yml'
      - 'MacWine/exp/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exp:
    name: Variant ${{ matrix.variant }}
    runs-on: macos-15
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        variant: [X0, X1]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: MacWine

      - uses: actions/download-artifact@v4
        with:
          name: MissionPlanner-macOS-wine
          path: dist
          run-id: 38951906793
          github-token: ${{ github.token }}

      - name: Install app
        run: |
          ditto -x -k dist/MissionPlanner-macOS-wine.zip /Applications
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          if [ "${{ matrix.variant }}" = X1 ]; then
            cp MacWine/exp/launcher-x1.sh "/Applications/Mission Planner.app/Contents/MacOS/MissionPlanner"
            chmod 755 "/Applications/Mission Planner.app/Contents/MacOS/MissionPlanner"
          fi

      - name: First start with process lists
        env:
          MPWINE_NONINTERACTIVE: '1'
          DEVELOPER_DIR: /var/empty
        run: |
          mkdir -p out
          MPLOG="$HOME/Library/MissionPlannerWine/prefix/drive_c/ProgramData/Mission Planner/MissionPlanner.log"
          START=$(date +%s)
          "/Applications/Mission Planner.app/Contents/MacOS/MissionPlanner" &
          for i in $(seq 1 120); do
            sleep 30
            { echo "=== $(( $(date +%s) - START )) s"; ps -axo pid,etime,%cpu,command | grep -iE 'wine|\.exe' | grep -v grep | cut -c1-220; } >> out/ps.log
            tail -1 ~/Library/Logs/MissionPlannerWine/launcher.log
            if grep -q "appload time" "$MPLOG" 2>/dev/null; then
              echo "MAIN WINDOW after $(( $(date +%s) - START )) s"; echo PASS > out/result.txt; break
            fi
          done
          [ -f out/result.txt ] || echo FAIL > out/result.txt
          screencapture -x out/screen.png || true
          cat ~/Library/Logs/MissionPlannerWine/launcher.log

      - name: Collect
        if: always()
        run: |
          cp -R ~/Library/Logs/MissionPlannerWine out/ 2>/dev/null || true
          cp "$HOME/Library/MissionPlannerWine/prefix/drive_c/ProgramData/Mission Planner/MissionPlanner.log" out/ 2>/dev/null || true
          cat out/result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp-${{ matrix.variant }}
          path: out
