name: macOS Wine experiment (temporary)
# Temporary: on some runners the wineserver ends about 12 s after Mission Planner
# starts, and Mission Planner then waits forever after "TTS: init". Find why:
# record when the server ends, its exit status (a foreground server under a
# wrapper), macOS crash reports and kernel messages, and the machine details.
# Uses the app that run 38981446483 built. Remove this file when the cause is known.

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/mac-wine-exp.yml']

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5]
    steps:
      - name: Get the app from run 38981446483
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38981446483 -n MissionPlanner-macOS-wine -D dist -R "$GITHUB_REPOSITORY"
          ditto -x -k dist/MissionPlanner-macOS-wine.zip /Applications
          xattr -r -w com.apple.quarantine "0081;00000000;Safari;" "/Applications/Mission Planner.app"
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Machine
        run: |
          mkdir -p out
          {
            sw_vers; uname -a
            sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize hw.model kern.osversion
            pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto 2>&1 | head -3
            system_profiler SPHardwareDataType SPDisplaysDataType 2>/dev/null
            ifconfig -l; scutil --nwi 2>/dev/null | head -30
            vm_stat; memory_pressure 2>/dev/null | tail -3
            ulimit -a; launchctl limit 2>/dev/null
            ls -la /tmp /private/tmp | head -20
            echo "TMPDIR=$TMPDIR"
          } > out/machine.txt 2>&1
          cat out/machine.txt | head -60

      - name: Starts
        run: |
          APP="/Applications/Mission Planner.app"
          export WINEPREFIX="$HOME/Library/MissionPlannerWine/prefix"
          W="$APP/Contents/Resources/wine/bin/wine"
          WS="$APP/Contents/Resources/wine/bin/wineserver"
          MPLOG="$WINEPREFIX/drive_c/ProgramData/Mission Planner/MissionPlanner.log"
          LLOG="$HOME/Library/Logs/MissionPlannerWine/launcher.log"
          now() { date '+%Y-%m-%d %H:%M:%S'; }
          since() { cat "$3.2" "$3.1" "$3" 2>/dev/null | grep -F "$2" | cut -c1-19 | awk -v t="$1" '$0 >= t { f = 1 } END { exit !f }'; }
          tmo() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          # One line per second: time, wineserver pids, MissionPlanner.exe pid and CPU time.
          monitor() {
            while true; do
              echo "$(date '+%H:%M:%S') ws=[$(pgrep -f 'bin/wineserver' | tr '\n' ' ')] mp=[$(ps ax -o pid=,time=,stat=,command= | grep 'Mission Planner/MissionPlanner.exe' | grep -v grep | awk '{print $1, $2, $3}' | tr '\n' ' ')]"
              sleep 1
            done
          }
          collect() {
            n=$1
            ps -axo pid,ppid,stat,etime,time,command | grep -E -i 'wine|mission|launcher|\.exe' | grep -v grep | cut -c1-220 > "out/$n-ps.txt" || true
            screencapture -x "out/$n.png" || true
            mkdir -p "out/$n-reports"
            cp ~/Library/Logs/DiagnosticReports/* "out/$n-reports/" 2>/dev/null || true
            sudo cp /Library/Logs/DiagnosticReports/* "out/$n-reports/" 2>/dev/null || true
            sudo chmod -R a+r "out/$n-reports" 2>/dev/null || true
            log show --last 20m --style compact --predicate 'eventMessage CONTAINS[c] "wineserver" OR process == "ReportCrash" OR process == "osanalyticshelper" OR eventMessage CONTAINS[c] "memorystatus" OR eventMessage CONTAINS[c] "CODE SIGNING"' 2>/dev/null | tail -800 > "out/$n-syslog.txt" || true
            tail -20 "$MPLOG" | cut -c1-250 > "out/$n-mplog.txt" || true
          }
          stop_all() {
            pkill -f 'Resources/launcher.sh' || true
            pkill -f 'Contents/MacOS/MissionPlanner' || true
            pkill -f 'Mission Planner/MissionPlanner.exe' || true
            "$WS" -k || true
            sleep 3
            # Wine processes without a server do not end by themselves.
            pkill -9 -f '^C:\\windows\\' || true
            pkill -9 -f 'Mission Planner/MissionPlanner.exe' || true
            pkill -9 -f 'bin/wineserver' || true
            sleep 2
          }
          wait_load() {
            n=$1; t0=$2; limit=$3; started=""
            for i in $(seq 1 400); do
              sleep 5
              if since "$t0" "appload time" "$MPLOG"; then echo "RESULT $n PASS" | tee -a out/results.txt; return 0; fi
              if [ -z "$started" ] && since "$t0" "starting MissionPlanner.exe" "$LLOG"; then started=$(date +%s); fi
              if [ -n "$started" ] && [ $(( $(date +%s) - started )) -gt "$limit" ]; then break; fi
            done
            echo "RESULT $n FAIL" | tee -a out/results.txt
            return 1
          }
          monitor > out/monitor.txt 2>&1 &
          MON=$!

          # 1: first start as in the smoke test.
          T=$(now)
          ( export MPWINE_NONINTERACTIVE=1 DEVELOPER_DIR=/var/empty; "$APP/Contents/MacOS/MissionPlanner" ) &
          wait_load first "$T" 240 || true
          collect first
          stop_all

          # 2: the server in the foreground under a wrapper that records its exit status.
          for k in 1 2; do
            ( "$WS" -f -p 600 > "out/fg$k-server.txt" 2>&1; echo "wineserver exit status $? at $(date '+%H:%M:%S')" >> "out/fg$k-server.txt" ) &
            sleep 3
            T=$(now)
            ( export MPWINE_NONINTERACTIVE=1; "$APP/Contents/MacOS/MissionPlanner" ) &
            wait_load "fg$k" "$T" 180 || true
            sleep 20
            collect "fg$k"
            stop_all
            cat "out/fg$k-server.txt" | tail -5
          done

          # 3: a normal warm start.
          T=$(now)
          ( export MPWINE_NONINTERACTIVE=1; "$APP/Contents/MacOS/MissionPlanner" ) &
          wait_load warm "$T" 180 || true
          collect warm
          stop_all
          kill $MON 2>/dev/null || true
          cat out/results.txt

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R ~/Library/Logs/MissionPlannerWine out/ 2>/dev/null || true
          cp "$HOME/Library/MissionPlannerWine/prefix/drive_c/ProgramData/Mission Planner/"MissionPlanner.log* out/ 2>/dev/null || true
          cat out/results.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.replica }}
          path: out
