name: macOS Wine Bundle
# Builds "Mission Planner.app" for macOS: the Windows build of this repository
# plus Wine (https://github.com/Gcenx/macOS_Wine_builds). See MacWine/README.md.

on:
  push:
    branches: [master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  WINE_URL: https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.0_1/wine-stable-11.0_1-osx64.tar.xz
  WINE_SHA256: b50dc50ec7f41d58b115a6b685d4d1315ba3c797bd3aa0f49213f2703cb82388
  WINETRICKS_URL: https://raw.githubusercontent.com/Winetricks/winetricks/20260125/src/winetricks
  WINETRICKS_SHA256: 431f82fc74000e6c864409f1d8fb495d696c03928808e3e8acffc45179312a7b

jobs:
  windows:
    name: Build Mission Planner (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 10

      - name: Build
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          msbuild -v:m -restore -t:Build -p:Configuration=Release MissionPlanner.sln

      - name: Cleanup
        shell: pwsh
        run: |
          cd bin\Release\net461
          gci plugins | ForEach-Object { if (Test-Path $_.Name -PathType Leaf) { Remove-Item $_.FullName } }

      - uses: actions/upload-artifact@v4
        with:
          name: mp-windows
          path: bin\Release\net461

  bundle:
    name: Build Mission Planner.app
    needs: windows
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: mp-windows
          path: mp-windows

      - name: Download Wine and winetricks
        run: |
          curl -fsSL -o wine.tar.xz "$WINE_URL"
          echo "$WINE_SHA256  wine.tar.xz" | shasum -a 256 -c -
          curl -fsSL -o winetricks "$WINETRICKS_URL"
          echo "$WINETRICKS_SHA256  winetricks" | shasum -a 256 -c -

      - name: Assemble app
        run: |
          MPV="$(tr -d '\r' < mp-windows/version.txt 2>/dev/null || echo 0)"
          VERSION="${MPV}-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          bash MacWine/build-app.sh --mp mp-windows --wine wine.tar.xz --winetricks winetricks \
            --version "$VERSION" --out dist --icon mpdesktop150.png

      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent "Mission Planner.app" MissionPlanner-macOS-wine.zip
          mkdir dmg && cp -R "Mission Planner.app" dmg/ && ln -s /Applications dmg/Applications
          cp ../MacWine/README.md "dmg/READ ME FIRST.md"
          hdiutil create -volname "Mission Planner" -srcfolder dmg -ov -format UDZO MissionPlanner-macOS-wine.dmg
          shasum -a 256 MissionPlanner-macOS-wine.* > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MissionPlanner-macOS-wine
          path: |
            dist/MissionPlanner-macOS-wine.dmg
            dist/MissionPlanner-macOS-wine.zip
            dist/checksums.txt

      - name: Publish prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="macwine-latest"
          gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Mission Planner for macOS (Wine) $VERSION" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA}. Read MacWine/README.md before first start." \
            dist/MissionPlanner-macOS-wine.dmg dist/MissionPlanner-macOS-wine.zip dist/checksums.txt

  smoke-test:
    name: Smoke test on macOS
    needs: bundle
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MissionPlanner-macOS-wine
          path: dist

      - name: Install app and Rosetta
        run: |
          ditto -x -k dist/MissionPlanner-macOS-wine.zip /Applications
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true && echo "Rosetta OK"

      - name: First start (installs .NET 4.8, then starts Mission Planner)
        run: |
          export MPWINE_NONINTERACTIVE=1
          "/Applications/Mission Planner.app/Contents/MacOS/MissionPlanner" &
          for i in $(seq 1 240); do
            sleep 10
            if pgrep -f 'MissionPlanner.exe' >/dev/null && [ -f ~/Library/MissionPlannerWine/state/mp-version ]; then
              echo "MissionPlanner.exe is running after $((i*10)) s"; break
            fi
            if ! pgrep -f 'Contents/MacOS/MissionPlanner' >/dev/null; then
              echo "Launcher exited early"; break
            fi
          done
          sleep 120
          pgrep -fl 'MissionPlanner.exe' || { echo "MissionPlanner.exe is NOT running"; echo FAIL > result.txt; }
          [ -f result.txt ] || echo PASS > result.txt
          screencapture -x screenshot.png || true

      - name: Collect logs
        if: always()
        run: |
          mkdir -p out
          cp -R ~/Library/Logs/MissionPlannerWine out/ 2>/dev/null || true
          cp -R ~/Documents/"Mission Planner" out/userdata 2>/dev/null || true
          cp screenshot.png result.txt out/ 2>/dev/null || true
          tail -50 out/MissionPlannerWine/launcher.log || true
          tail -80 out/MissionPlannerWine/wine.log || true
          cat result.txt
          grep -q PASS result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: out
