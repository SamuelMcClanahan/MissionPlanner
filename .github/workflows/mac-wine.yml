name: macOS Wine Bundle
# Builds "Mission Planner.app" for macOS: the Windows build of this repository
# plus Wine (https://github.com/Gcenx/macOS_Wine_builds). See MacWine/README.md.

on:
  push:
    branches: [master, 'claude/**']
  workflow_dispatch:

concurrency:
  group: mac-wine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WINE_URL: https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.0_1/wine-stable-11.0_1-osx64.tar.xz
  WINE_SHA256: b50dc50ec7f41d58b115a6b685d4d1315ba3c797bd3aa0f49213f2703cb82388

jobs:
  windows:
    name: Build Mission Planner (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 10

      - name: Build
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          msbuild -v:m -restore -t:Build -p:Configuration=Release MissionPlanner.sln

      - name: Cleanup
        shell: pwsh
        run: |
          cd bin\Release\net461
          gci plugins | ForEach-Object { if (Test-Path $_.Name -PathType Leaf) { Remove-Item $_.FullName } }

      - uses: actions/upload-artifact@v4
        with:
          name: mp-windows
          path: bin\Release\net461

  bundle:
    name: Build Mission Planner.app
    needs: windows
    runs-on: macos-15
    outputs:
      version: ${{ steps.asm.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: mp-windows
          path: mp-windows

      - name: Download Wine
        run: |
          curl -fsSL -o wine.tar.xz "$WINE_URL"
          echo "$WINE_SHA256  wine.tar.xz" | shasum -a 256 -c -

      - name: Assemble app
        id: asm
        run: |
          MPV="$(tr -d '\r' < mp-windows/version.txt 2>/dev/null || echo 0)"
          VERSION="${MPV}-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          bash MacWine/build-app.sh --mp mp-windows --wine wine.tar.xz \
            --version "$VERSION" --out dist --icon mpdesktop150.png

      - name: Package
        run: |
          file "dist/Mission Planner.app/Contents/MacOS/MissionPlanner"
          codesign --verify --deep --verbose=1 "dist/Mission Planner.app" || true
          cd dist
          ditto -c -k --keepParent "Mission Planner.app" MissionPlanner-macOS-wine.zip
          mkdir dmg && cp -R "Mission Planner.app" dmg/ && ln -s /Applications dmg/Applications
          cp ../MacWine/README.md "dmg/READ ME FIRST.md"
          for i in 1 2 3; do
            hdiutil create -volname "Mission Planner" -srcfolder dmg -ov -format UDZO MissionPlanner-macOS-wine.dmg && break
            sleep 10
          done
          [ -f MissionPlanner-macOS-wine.dmg ] || { echo "DMG was not created"; exit 1; }
          shasum -a 256 MissionPlanner-macOS-wine.* > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MissionPlanner-macOS-wine
          path: |
            dist/MissionPlanner-macOS-wine.dmg
            dist/MissionPlanner-macOS-wine.zip
            dist/checksums.txt

  smoke-test:
    name: Smoke test on macOS (${{ matrix.replica }})
    needs: bundle
    runs-on: macos-15
    timeout-minutes: 60
    # Three machines at the same time: a start that stops only sometimes shows up more often.
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MissionPlanner-macOS-wine
          path: dist

      - name: Install app and Rosetta
        run: |
          ditto -x -k dist/MissionPlanner-macOS-wine.zip /Applications
          # Like a download from the web: set quarantine, the launcher must remove it.
          xattr -r -w com.apple.quarantine "0081;00000000;Safari;" "/Applications/Mission Planner.app"
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true && echo "Rosetta OK"
          # devfs gets a random device number at each boot. When its top bit is set,
          # the original Wine 11 wineserver crashes as soon as Mission Planner lists
          # serial ports (see MacWine/patch-wineserver.py). Say which case this is.
          d=$(stat -f %d /dev)
          if [ "$d" -lt 0 ] || [ "$d" -ge 2147483648 ]; then
            echo "devfs device number $d: negative as dev_t, this run tests the wineserver patch"
          else
            echo "devfs device number $d: positive as dev_t"
          fi
          # Helpers for the start steps.
          cat > "$RUNNER_TEMP/smoke-lib.sh" <<'EOF'
          APP="/Applications/Mission Planner.app"
          export WINEPREFIX="$HOME/Library/MissionPlannerWine/prefix"
          WINE="$APP/Contents/Resources/wine/bin/wine"
          MPLOG="$WINEPREFIX/drive_c/ProgramData/Mission Planner/MissionPlanner.log"
          LLOG="$HOME/Library/Logs/MissionPlannerWine/launcher.log"
          now() { date '+%Y-%m-%d %H:%M:%S'; }
          # True when a log has a line that contains $2 at or after time $1. It reads
          # the rolled copies too (.1, .2 at 1 MB and .DATE at midnight).
          since() { cat "$3"* 2>/dev/null | grep -F "$2" | cut -c1-19 | awk -v t="$1" '$0 >= t { f = 1 } END { exit !f }'; }
          loaded_since() { since "$1" "appload time" "$MPLOG"; }
          exe_started_since() { since "$1" "starting MissionPlanner.exe" "$LLOG"; }
          tmo() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          # Records where Mission Planner stops: process list, Wine backtraces, macOS logs.
          diag() {
            mkdir -p out
            ps -axo pid,ppid,stat,etime,time,command | grep -E -i 'wine|mission|launcher|\.exe|caffeinate|osascript' | grep -v grep | cut -c1-220 > "out/$1-ps.txt" || true
            screencapture -x "out/$1.png" || true
            WINEDEBUG=-all WINEDLLOVERRIDES="winedbg.exe=b" tmo 60 "$WINE" winedbg --command "info process" > "out/$1-procs.txt" 2>&1 || true
            wpid=$(grep -i 'MissionPlanner.exe' "out/$1-procs.txt" | grep -o -E '[0-9a-fA-F]{8}' | head -1)
            printf 'info threads\ninfo share\nbt all\ndetach\n' > "$WINEPREFIX/drive_c/bt.txt"
            if [ -n "$wpid" ]; then
              WINEDEBUG=-all WINEDLLOVERRIDES="winedbg.exe=b" tmo 180 "$WINE" winedbg --file 'C:\bt.txt' "0x$wpid" > "out/$1-bt.txt" 2>&1 || true
            fi
            log show --last 15m --style compact --predicate 'process == "tccd" OR process == "syspolicyd" OR subsystem == "com.apple.TCC"' 2>/dev/null | tail -300 > "out/$1-syslog.txt" || true
          }
          EOF

      - name: First start (installs .NET 4.8, then starts Mission Planner)
        run: |
          . "$RUNNER_TEMP/smoke-lib.sh"
          export MPWINE_NONINTERACTIVE=1
          # Behave like a Mac without the Xcode Command Line Tools.
          export DEVELOPER_DIR=/var/empty
          T=$(now); START=$(date +%s); EXE=""
          "$APP/Contents/MacOS/MissionPlanner" &
          for i in $(seq 1 300); do
            sleep 10
            if loaded_since "$T"; then
              echo "Mission Planner main window loaded after $(( $(date +%s) - START )) s"; break
            fi
            if ! pgrep -f 'Contents/MacOS/MissionPlanner' >/dev/null; then
              echo "Launcher exited early"; break
            fi
            # After setup, the main window must load within 5 minutes.
            if [ -z "$EXE" ] && exe_started_since "$T"; then EXE=$(date +%s); fi
            if [ -n "$EXE" ] && [ $(( $(date +%s) - EXE )) -gt 300 ]; then
              echo "Mission Planner did not load within 5 minutes after setup"; diag first; break
            fi
          done
          sleep 60
          screencapture -x screenshot.png || true
          if loaded_since "$T" && pgrep -f MissionPlanner.exe >/dev/null; then
            echo PASS > result.txt
          else
            echo FAIL > result.txt
          fi
          grep -E "appload time|Exception" "$MPLOG" 2>/dev/null | head -20 || true

      - name: Second start (timing)
        if: success()
        run: |
          . "$RUNNER_TEMP/smoke-lib.sh"
          export MPWINE_NONINTERACTIVE=1
          pkill -f 'Contents/MacOS/MissionPlanner' || true
          pkill -f MissionPlanner.exe || true
          "$APP/Contents/Resources/wine/bin/wineserver" -k || true
          sleep 5
          T=$(now); START=$(date +%s)
          "$APP/Contents/MacOS/MissionPlanner" &
          for i in $(seq 1 60); do
            sleep 5
            if loaded_since "$T"; then
              echo "Second start: main window loaded after $(( $(date +%s) - START )) s"; break
            fi
          done
          if ! loaded_since "$T"; then
            echo "Second start: Mission Planner did not load within 5 minutes"; diag second
            echo FAIL > result.txt
          fi

      - name: Collect logs
        if: always()
        run: |
          mkdir -p out
          cp -R ~/Library/Logs/MissionPlannerWine out/ 2>/dev/null || true
          cp "$HOME/Library/MissionPlannerWine/prefix/drive_c/ProgramData/Mission Planner/"MissionPlanner.log* out/ 2>/dev/null || true
          cp screenshot.png result.txt out/ 2>/dev/null || true
          tail -60 out/MissionPlannerWine/launcher.log || true
          tail -60 out/MissionPlannerWine/wine.log.1 || true
          tail -40 out/MissionPlannerWine/wine.log || true
          # The HUD must draw: an OpenGL HUD failure logs AccessViolationException
          # from HUD.OnPaint (the app uses the GDI+ HUD by default for this reason).
          if grep -q "MissionPlanner.Controls.HUD - System.AccessViolationException" out/MissionPlannerWine/wine.log 2>/dev/null; then
            echo "HUD drawing fails"; echo FAIL > result.txt
          fi
          cat result.txt
          grep -q PASS result.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results-${{ matrix.replica }}
          path: out

  publish:
    name: Publish macwine-latest
    needs: [bundle, smoke-test]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/claude/cool-gates-xso4we'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: macwine-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MissionPlanner-macOS-wine
          path: dist

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          TAG=macwine-latest
          TITLE="Mission Planner for macOS (Wine) $VERSION"
          NOTES="Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA}. Passed the macOS smoke test. Read READ ME FIRST in the DMG before the first start."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Upload the new files under temporary names first, then replace each old
            # file and rename the new one. If the upload stops (failure or a cancelled
            # run), the old files stay. checksums.txt goes last.
            FILES="MissionPlanner-macOS-wine.dmg MissionPlanner-macOS-wine.zip checksums.txt"
            for f in $FILES; do mv "dist/$f" "dist/new-$f"; done
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/new-*
            REL=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
            asset_id() { gh api "repos/$GITHUB_REPOSITORY/releases/$REL/assets" --paginate --jq ".[] | select(.name == \"$1\") | .id"; }
            for f in $FILES; do
              new=$(asset_id "new-$f")
              [ -n "$new" ] || { echo "upload of $f is missing"; exit 1; }
              old=$(asset_id "$f")
              if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$new" -f name="$f" > /dev/null
            done
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "$TITLE" --notes "$NOTES" \
              dist/MissionPlanner-macOS-wine.dmg dist/MissionPlanner-macOS-wine.zip dist/checksums.txt
          fi
